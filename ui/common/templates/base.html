<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Resume Tailoring Pipeline{% endblock %}</title>
    <link rel="stylesheet" href="/static/common.css">
    <script src="/static/app.js"></script>
</head>
<body>
    <nav class="topnav">
        <a href="/" class="topnav-brand">
            <span class="topnav-logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2.5L14.6 9.4L21.5 12L14.6 14.6L12 21.5L9.4 14.6L2.5 12L9.4 9.4L12 2.5Z" fill="white"/>
                </svg>
            </span>
            <span class="topnav-brand-name">JobPilot</span>
        </a>

        <span class="topnav-divider"></span>

        <div class="topnav-links">
            <a href="/" class="topnav-link {% if request.url.path == '/' %}active{% endif %}">
                <svg class="topnav-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>{{ t.nav_dashboard }}</span>
            </a>
            <a href="/automation" class="topnav-link {% if request.url.path.startswith('/automation') %}active{% endif %}">
                <svg class="topnav-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                <span>{{ t.nav_automation }}</span>
            </a>
            <a href="/tracker" class="topnav-link {% if request.url.path.startswith('/tracker') %}active{% endif %}">
                <svg class="topnav-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1.5"></rect><rect x="14" y="3" width="7" height="11" rx="1.5"></rect></svg>
                <span>{{ t.nav_tracker }}</span>
            </a>
            <a href="/settings" class="topnav-link {% if request.url.path.startswith('/settings') %}active{% endif %}">
                <svg class="topnav-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>{{ t.nav_settings }}</span>
            </a>
        </div>

        <div class="topnav-right">
            <a href="https://buymeabitcoffee.vercel.app/btc/bc1qa4sp2mexjp4zmx2qc5g0etpt9fxk93fqfs0nul?identifier=andrey+undetected" target="_blank" rel="noopener noreferrer" class="sponsor-link" title="{{ t.sponsor_label }}">
                <svg class="sponsor-heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.9-4.35-9.5-8.15C.7 9.95 1.4 6.35 4.3 4.75c2.3-1.25 4.9-.55 6.4 1.35L12 7.6l1.3-1.5c1.5-1.9 4.1-2.6 6.4-1.35 2.9 1.6 3.6 5.2 1.8 8.1C18.9 16.65 12 21 12 21z"></path></svg>
                <span>{{ t.sponsor_label }}</span>
            </a>
            <div class="custom-select" id="lang-select">
                <button type="button" class="custom-select-trigger">
                    <span data-select-label>{{ "EN" if lang == "en" else "RU" }}</span>
                    <svg class="custom-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
                <div class="custom-select-menu">
                    <button type="button" class="custom-select-option {% if lang == 'en' %}selected{% endif %}" data-value="en" data-label="EN">
                        <span>English</span>
                        <svg class="custom-select-option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </button>
                    <button type="button" class="custom-select-option {% if lang == 'ru' %}selected{% endif %}" data-value="ru" data-label="RU">
                        <span>Русский</span>
                        <svg class="custom-select-option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
    initCustomSelect(document.getElementById("lang-select"), async (value) => {
        const formData = new FormData();
        formData.append("lang", value);
        await fetch("/set-language", { method: "POST", body: formData });
        window.location.reload();
    });
    </script>
</body>
</html>
