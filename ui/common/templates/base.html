<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Resume Tailoring Pipeline{% endblock %}</title>
    <link rel="stylesheet" href="/static/common.css">
    <script src="/static/app.js"></script>
</head>
<body>
    <nav class="topnav">
        <a href="/">{{ t.nav_dashboard }}</a>
        <a href="/settings">{{ t.nav_settings }}</a>
        <a href="/evaluator">{{ t.nav_evaluator }}</a>
        <a href="/tailor">{{ t.nav_tailor }}</a>
        <a href="/questions">{{ t.nav_questions }}</a>
        <a href="/tracker">{{ t.nav_tracker }}</a>
        <a href="/automation">{{ t.nav_automation }}</a>

        <form id="lang-form" class="lang-form">
            <select name="lang" id="lang-select">
                <option value="en" {% if lang == "en" %}selected{% endif %}>EN</option>
                <option value="ru" {% if lang == "ru" %}selected{% endif %}>RU</option>
            </select>
        </form>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
    document.getElementById("lang-select").addEventListener("change", async (event) => {
        const formData = new FormData();
        formData.append("lang", event.target.value);
        await fetch("/set-language", { method: "POST", body: formData });
        window.location.reload();
    });
    </script>
</body>
</html>
